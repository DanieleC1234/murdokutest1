<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Murder Grid</title>
<meta name="description" content="Five murder mystery logic puzzles. Find the murderer!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Special+Elite&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eee1c7; --card:#fbf7ee; --ink:#2b211b; --muted:#6e5d4d;
  --line:#cdb994; --wall:#3a2a1f; --red:#b3261e; --blue:#2f5d8a; --green:#3e7b43;
  --shadow:0 1px 0 rgba(58,42,31,.12), 0 3px 10px rgba(58,42,31,.12);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:radial-gradient(circle at 20% 10%, rgba(255,255,255,.35), transparent 40%),radial-gradient(circle at 90% 80%, rgba(160,120,70,.10), transparent 45%), var(--paper)}
body.playing{overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* ---------- home ---------- */
.home-head{text-align:center;padding:34px 0 10px}
.logo{font-family:'Special Elite',monospace;font-size:clamp(38px,11vw,64px);letter-spacing:2px;line-height:1;margin:0}
.logo .blood{color:var(--red);margin-left:.25em}
.tag{margin:10px 0 0;color:var(--muted);font-weight:600}
.home-actions{display:flex;justify-content:center;gap:10px;margin:18px 0 8px}
.pill{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.pill:active{transform:translateY(2px);box-shadow:none}
.cases{display:grid;gap:14px;margin:18px 0 40px}
.case{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);position:relative}
.case:active{transform:translateY(3px);box-shadow:none}
.case-num{flex:0 0 58px;height:58px;border-radius:10px;background:var(--wall);color:#f5e7c8;display:grid;place-items:center;font-family:'Special Elite',monospace;font-size:28px}
.case-title{font-family:'Special Elite',monospace;font-size:19px;margin:0 0 4px}
.case-meta{font-size:14px;color:var(--muted);font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.chip.medium{background:#f3d98a;color:#5b4300}
.chip.hard{background:#e9a393;color:#5a130d}
.chip.done{background:#b9dcb0;color:#1e4a17}
.chip.prog{background:#d7e3f1;color:#1d3b5c}
.stamp{position:absolute;right:12px;top:10px;transform:rotate(8deg);border:3px solid var(--red);color:var(--red);font-family:'Special Elite',monospace;font-size:13px;padding:2px 6px;border-radius:4px;opacity:.85}

/* ---------- case screen: everything on one screen ---------- */
#caseView{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"top" "board" "side" "tools";height:100vh;height:100dvh}
#caseView.land{grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top tools" "board side tools"}
.topbar{grid-area:top;display:flex;align-items:center;gap:8px;padding:5px 8px;padding-top:calc(5px + env(safe-area-inset-top));border-bottom:2px solid var(--line);background:rgba(238,225,199,.96)}
.iconbtn{width:34px;height:34px;border-radius:9px;border:2px solid var(--ink);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:0 0 auto;padding:0}
.iconbtn svg{width:19px;height:19px}
.tb-title{flex:1;min-width:0;line-height:1.15}
.tb-title b{display:block;font-family:'Special Elite',monospace;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title span{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}

.boardbox{grid-area:board;display:flex;justify-content:center;align-items:flex-start;padding:6px 6px 2px}
#caseView.land .boardbox{padding:6px 4px 6px 8px;padding-left:calc(8px + env(safe-area-inset-left))}
.board-wrap{overflow:hidden;position:relative;border-radius:4px}
.board-wrap.zoomed{overflow:auto;scrollbar-width:thin;outline:2px dashed var(--line)}
.board{display:grid;grid-template-columns:14px 1fr;grid-template-rows:14px 1fr}
.coords-c{grid-column:2;display:grid;font-weight:800;font-size:10px;color:var(--muted);text-align:center;align-items:end}
.coords-r{grid-row:2;display:grid;font-weight:800;font-size:10px;color:var(--muted);align-items:center;text-align:left}
.grid-area{grid-column:2;grid-row:2;position:relative;box-shadow:var(--shadow)}
.grid-area svg,.grid-area canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#caseView,#caseView *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grid-area,.grid-area *{-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
.grid-area svg{pointer-events:none}
#ink{touch-action:none;cursor:crosshair}
#overlay{pointer-events:none}

.side{grid-area:side;overflow-y:auto;min-height:0;padding:4px 8px 8px;-webkit-overflow-scrolling:touch}
#caseView.land .side{padding:6px 8px}
.resultbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px 8px;margin-bottom:6px;font-weight:700;font-size:13px}
.resultbar .who{flex:1;min-width:120px}
.resultbar .who b{font-family:Caveat,cursive;font-size:22px;color:var(--red)}
.sbtn{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:4px 9px;font-weight:800;font-size:12px;cursor:pointer}
.sbtn.primary{background:var(--ink);color:#fff}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:5px}
.pc{display:flex;gap:6px;align-items:flex-start;background:var(--card);border-radius:9px;padding:5px 6px;box-shadow:var(--shadow);min-width:0}
.pc .av{flex:0 0 34px;width:34px;background:#fff;padding:2px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.pc .av svg{display:block;width:100%;height:auto}
.pc .tx{min-width:0;flex:1}
.pc .nm{display:flex;align-items:center;gap:5px;font-weight:800;font-size:13px;line-height:1.1;margin-bottom:2px}
.pc .nm .nmtext{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagb{flex:0 0 auto;font-size:10.5px;font-weight:800;min-width:22px;height:17px;padding:0 4px;border-radius:9px;background:var(--ink);color:#fff;display:inline-grid;place-items:center;letter-spacing:.3px}
.pc .cl{font-size:11.5px;line-height:1.25;font-weight:600;color:#3b2f26}
.pc.victim{background:#2c2420;color:#f4e9d6}
.pc.victim .cl{color:#e9dcc6}
.pc.victim .av svg{filter:grayscale(1)}
.pc.victim .tagb{background:var(--red)}
.vlabel{font-size:9px;font-weight:800;color:#ff8a7e;border:1.5px solid #ff8a7e;border-radius:3px;padding:0 3px;letter-spacing:.5px}
.globals{margin-top:5px;background:#d9e4ef;border:1.5px solid #9fb5cc;border-radius:9px;padding:4px 8px;font-size:12px;font-weight:700}
.globals span{color:#2f4d6b;text-transform:uppercase;font-size:10px;letter-spacing:.4px;margin-right:4px}
.legend{margin-top:5px;display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11px;font-weight:700;color:var(--muted);align-items:center}
.legend .grp{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.legend svg{width:17px;height:17px;border-radius:3px;background:#efe3c9;vertical-align:middle}
.legend .ok{color:var(--green)} .legend .no{color:var(--red)}

/* toolbar */
.toolbar{grid-area:tools;background:var(--wall);padding:5px 6px calc(5px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
#caseView.land .toolbar{grid-template-columns:1fr;grid-auto-rows:1fr;padding:6px;padding-right:calc(6px + env(safe-area-inset-right));width:64px}
.tool{background:#4d3a2c;border:0;border-radius:9px;color:#f5e7c8;padding:4px 1px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:800;cursor:pointer;min-width:0}
.tool svg{width:21px;height:21px}
.tool.on{background:#f5e7c8;color:var(--wall)}
.tool.accuse{background:var(--red);color:#fff}
.tool:active{filter:brightness(1.2)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(30,20,14,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);border-radius:16px;max-width:520px;width:100%;max-height:90vh;max-height:90dvh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.sheet h2{font-family:'Special Elite',monospace;margin:0 0 10px;font-size:22px}
.sheet p,.sheet li{line-height:1.5}
.sheet ol{padding-left:20px}
.sheet .btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.btn{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:9px 15px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.btn.primary{background:var(--ink);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 2px 0 #6d1510}
.btn:disabled{opacity:.45}
.btn:active{transform:translateY(2px);box-shadow:none}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.pick button{background:#fff;border:2px solid var(--line);border-radius:10px;padding:5px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.pick button svg{width:52px;height:auto}
.pick button span{font-family:Caveat,cursive;font-size:20px;font-weight:700;line-height:1.1}
.pick button.sel{border-color:var(--red);background:#fdecea}
.result-stamp{display:inline-block;font-family:'Special Elite',monospace;font-size:24px;border:4px solid currentColor;padding:4px 12px;transform:rotate(-4deg);margin:4px 0 10px;border-radius:6px}
.story{font-size:16px;line-height:1.55;border-left:5px solid var(--red);padding-left:12px}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;padding:11px 15px;border-radius:12px;font-weight:700;max-width:min(92vw,460px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
body.land .toast{bottom:14px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="f-chair" viewBox="0 0 100 100"><rect x="27" y="20" width="46" height="13" rx="5" fill="#6f4125"/><rect x="27" y="33" width="46" height="45" rx="7" fill="#a86a3d"/><rect x="33" y="39" width="34" height="33" rx="5" fill="#c68a58"/></symbol>

<!-- HOME -->
<main id="home" class="wrap">
  <header class="home-head">
    <h1 class="logo">MURDER<span class="blood">GRID</span></h1>
    <p class="tag">Sudoku meets murder mystery. Place every suspect, find the killer.</p>
    <div class="home-actions"><button class="pill" id="btnRulesHome">How to play</button></div>
  </header>
  <section class="cases" id="caseList"></section>
</main>

<!-- CASE -->
<div id="caseView" class="hidden">
  <header class="topbar" id="topbar">
    <button class="iconbtn" id="btnBack" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="tb-title"><b id="cTitle"></b><span id="cMeta"></span></div>
    <button class="iconbtn" id="btnStory" aria-label="Story"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg></button>
    <button class="iconbtn" id="btnRules" aria-label="Rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.2a2.6 2.6 0 1 1 3.6 2.4c-.8.4-1.1.9-1.1 1.7v.4"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg></button>
  </header>
  <div class="boardbox">
    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board">
        <div class="coords-c" id="colsLbl"></div>
        <div class="coords-r" id="rowsLbl"></div>
        <div class="grid-area" id="gridArea">
          <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
          <canvas id="ink"></canvas>
          <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>
    </div>
  </div>
  <section class="side" id="side"><div id="sideInner">
    <div id="resultBar"></div>
    <div class="people" id="people"></div>
    <div class="globals hidden" id="globals"></div>
    <div class="legend" id="legend"></div>
  </div></section>
  <nav class="toolbar" id="toolbar">
    <button class="tool on" id="tPen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg>Pen</button>
    <button class="tool" id="tEraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M8 20h12"/><path d="M4.6 14.6l9.9-9.9a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L11 18H7.4l-2.8-2.8a1 1 0 0 1 0-1.4z"/><path d="M9 10l5 5"/></svg>Eraser</button>
    <button class="tool" id="tUndo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
    <button class="tool" id="tClear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Clear</button>
    <button class="tool" id="tZoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></svg><span id="zoomLbl">Zoom</span></button>
    <button class="tool" id="tHint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Hint</button>
    <button class="tool accuse" id="tAccuse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L21 21"/><path d="M11 8v3.5M11 14h.01"/></svg>Accuse</button>
  </nav>
</div>

<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>

  let g='';for(let i=1;i<n;i++)g+=`M${i*S} 0V${W}M0 ${i*S}H${W}`;
  s+=`<path d="${g}" stroke="rgba(40,25,15,.22)" stroke-width="2"/>`;
  let w='';

    let cy=(maxR+1)*S; if(maxR===n-1) cy-=fs*0.9;

  });

  if(!ink.pointers.has(e.pointerId))return;
  ink.pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ink.pointers.size>=2&&ink.pan){
    const m=mid(), bw=$('boardWrap');
    bw.scrollLeft-=m.x-ink.pan.x; bw.scrollTop-=m.y-ink.pan.y; ink.pan=m; return;
  }
  if(!ink.curStroke)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  const from=ink.curStroke.p.length;
  for(const ev of (evs.length?evs:[e])){const q=ptOf(ev);ink.curStroke.p.push(q[0],q[1]);}
  drawStroke(ink.curStroke,from);
}
function onUp(e){
  ink.pointers.delete(e.pointerId);
  if(ink.pointers.size<2)ink.pan=null;
  if(ink.pointers.size===0&&ink.curStroke){ink.curStroke=null;saveState();}
  if(ink.pointers.size===0)ink.ctx.globalCompositeOperation='source-over';
}
function setTool(t){ink.tool=t;$('tPen').classList.toggle('on',t==='pen');$('tEraser').classList.toggle('on',t==='eraser');}

/* ---------- layout: map + people on one screen ---------- */
let cur=null, zoom=1, boardSize=300;
function layout(){
  if(!cur)return;
  const vw=window.innerWidth, vh=window.innerHeight;
  const land=vw>vh;
  $('caseView').classList.toggle('land',land);
  document.body.classList.toggle('land',land);
  const top=$('topbar').offsetHeight;
  let size;
  if(land){
    const tools=$('toolbar').offsetWidth;
    size=Math.min(vh-top-12, (vw-tools-16)*0.62);
  } else {
    const tools=$('toolbar').offsetHeight, avW=vw-12, avH=vh-top-tools-10;
    const need=$('sideInner').scrollHeight+14;
    size=Math.min(avW, Math.max(avH-need, avH*0.5));
  }
  boardSize=Math.max(160,Math.floor(size));
  const bw=$('boardWrap'); bw.style.width=bw.style.height=boardSize+'px';
  applyZoom();
}
function applyZoom(){
  const b=$('board'), s=Math.round(boardSize*zoom);
  b.style.width=b.style.height=s+'px';
  $('boardWrap').classList.toggle('zoomed',zoom>1);
  $('zoomLbl').textContent=zoom===1?'Zoom':zoom+'×';
  resizeInk();
}

/* ---------- UI ---------- */
function renderHome(){
  $('caseList').innerHTML=LEVELS.map((L,i)=>{
    const st=loadState(i), story=STORIES[i];
    const status=st.solved?'<span class="chip done">Solved</span>':st.revealed?'<span class="chip prog">Revealed</span>':(st.strokes.length?'<span class="chip prog">In progress</span>':'');
    return `<button class="case" data-i="${i}"><div class="case-num">${i+1}</div><div>
      <p class="case-title">${story.title}</p>
      <div class="case-meta"><span class="chip ${L.diff}">${L.diff}</span><span>${L.n}×${L.n}</span><span>${L.persons.length-1} suspects</span>${status}</div></div>
      ${st.solved?'<span class="stamp">CLOSED</span>':''}</button>`;}).join('');
  document.querySelectorAll('.case').forEach(b=>b.onclick=()=>{location.hash='case-'+(+b.dataset.i+1);});
}
function openCase(i){
  const L=LEVELS[i]; cur={idx:i,L,st:loadState(i),showSolution:true};
  $('home').classList.add('hidden'); $('caseView').classList.remove('hidden'); document.body.classList.add('playing');
  $('cTitle').textContent=`${i+1}. ${STORIES[i].title}`;
  $('cMeta').textContent=`${L.diff==='hard'?'Hard':'Medium'} · ${L.n}×${L.n} · ${L.persons.length-1} suspects + victim`;
  renderMap(L); renderPeople(L); renderLegend(L); renderResult();
  zoom=1; setTool('pen');
  window.scrollTo(0,0);
  layout();
  requestAnimationFrame(()=>{layout();resizeInk();renderOverlay();});
  if(!cur.st.introSeen){cur.st.introSeen=true;saveState();showStory();}
}
function renderLegend(L){
  const present=[...new Set(L.furn.filter(Boolean))];
  const ic=t=>`<svg viewBox="0 0 100 100" aria-label="${FURN[t].name}"><title>${FURN[t].name}</title><use href="#f-${t}"/></svg>`;
  const ok=present.filter(t=>FURN[t].occ), no=present.filter(t=>!FURN[t].occ);
  $('legend').innerHTML=`<span class="grp"><span class="ok">✔ can be on:</span> empty, ${ok.map(ic).join('')}</span><span class="grp"><span class="no">✘ never on:</span> ${no.map(ic).join('')}</span>`;
}
function renderPeople(L){
  $('people').innerHTML=L.persons.map(p=>`<div class="pc ${p.role==='victim'?'victim':''}">
    <div class="av">${avatar(p.name)}</div>
    <div class="tx"><div class="nm"><span class="tagb">${p.tag}</span><span class="nmtext">${p.name}</span>${p.role==='victim'?'<span class="vlabel">VICTIM</span>':''}</div>
    <div class="cl">${p.clue}</div></div></div>`).join('');
  const g=$('globals');
  if(L.globals.length){g.classList.remove('hidden');g.innerHTML='<span>Also known:</span>'+L.globals.join(' ');}
  else g.classList.add('hidden');
}
function renderResult(){
  const {L,st}=cur, rb=$('resultBar');
  if(!(st.solved||st.revealed)){rb.innerHTML='';rb.className='';return;}
  rb.className='resultbar';
  rb.innerHTML=`<span class="who">${st.solved?'Case closed! The murderer is':'The murderer was'} <b>${L.persons[L.murderer].name}</b></span>
    <button class="sbtn" id="btnSol">${cur.showSolution?'Hide solution':'Show solution'}</button>
    ${cur.idx<LEVELS.length-1?'<button class="sbtn primary" id="btnNext">Next case →</button>':''}`;
  $('btnSol').onclick=()=>{cur.showSolution=!cur.showSolution;renderOverlay();renderResult();};
  if($('btnNext'))$('btnNext').onclick=()=>{location.hash='case-'+(cur.idx+2);};
}

function modal(html){ $('sheet').innerHTML=html; $('modal').classList.remove('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); }
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
let toastT;
function toast(msg,ms=3500){const t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hidden'),ms);}
function ask(title,text,okLabel,danger,onOk){
  modal(`<h2>${title}</h2><p>${text}</p><div class="btns"><button class="btn" id="mNo">Cancel</button><button class="btn ${danger?'danger':'primary'}" id="mOk">${okLabel}</button></div>`);
  $('mNo').onclick=closeModal; $('mOk').onclick=()=>{closeModal();onOk();};
}
function showStory(){
  const L=cur.L;
  modal(`<h2>Case ${cur.idx+1}: ${STORIES[cur.idx].title}</h2><p class="story">${STORIES[cur.idx].intro}</p>
    <p style="color:#6e5d4d;font-size:14px">${L.diff==='hard'?'Hard':'Medium'} · ${L.n}×${L.n} map · ${L.persons.length-1} suspects</p>
    <div class="btns"><button class="btn primary" id="mOk">Start investigating</button></div>`);
  $('mOk').onclick=closeModal;
}
function showRules(){
  const icons=t=>`<svg viewBox="0 0 100 100" style="width:24px;height:24px;vertical-align:middle;background:#efe3c9;border-radius:4px"><use href="#f-${t}"/></svg>`;
  modal(`<h2>How to play</h2>
  <p>Each case is a floor plan divided into rooms. Every suspect <b>and the victim</b> are somewhere on the map. Use the clues to find where each person was, then name the murderer.</p>
  <ol>
    <li><b>One person per row and one per column.</b> Every row and every column contains exactly one person.</li>
    <li>People can stand on an empty square or be on a chair ${icons('chair')}, sofa ${icons('sofa')}, bed ${icons('bed')} or rug ${icons('rug')}.</li>
    <li>Nobody can be on a table ${icons('table')}, plant ${icons('plant')}, TV ${icons('tv')}, stove ${icons('stove')}, bathtub ${icons('bath')}, bookcase ${icons('shelf')} or tree ${icons('tree')}.</li>
    <li><b>"Next to"</b> means directly above, below, left or right, not diagonally.</li>
    <li><b>"Alone"</b> means nobody else, the victim included, was in the same room.</li>
    <li><b>The murderer is the only suspect who was in the same room as the victim.</b></li>
  </ol>
  <p><b>Tools:</b> write on the map with the <b>Pen</b>. Use each person's two-letter tag (like <span class="tagb">Da</span>) to note who could be in a square, or draw an X. Fix mistakes with the <b>Eraser</b> or <b>Undo</b>. <b>Zoom</b> makes the map bigger; then move it with two fingers. <b>Hint</b> reveals where one person was. When you know who did it, press <b>Accuse</b>.</p>
  <p><b>Tip:</b> turn your phone sideways for a bigger map.</p>
  <p>Each case has exactly one solution, reachable by logic alone. Your notes are saved on this device.</p>
  <div class="btns"><button class="btn primary" id="mOk">Got it</button></div>`);
  $('mOk').onclick=closeModal;
}
function doHint(){
  const {L,st}=cur;
  if(st.solved||st.revealed){toast('This case is already closed.');return;}
  const order=[...L.persons.keys()]; const r=rngFrom(hashStr(STORIES[cur.idx].title));
  for(let i=order.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  const next=order.find(i=>!st.hints.includes(i)&&i!==L.murderer);
  if(next===undefined){toast('No more hints. You can do it!');return;}
  ask('Use a hint?','A hint shows where one person was on the map.','Show hint',false,()=>{
    st.hints.push(next); saveState(); renderOverlay();
    const p=L.persons[next];
    toast(`Hint: ${p.name} (${p.tag})${p.role==='victim'?', the victim,':''} was in square ${cellName(L,L.solution[next])}.`,5000);
  });
}
function accuse(){
  const {L,st}=cur;
  if(st.solved){toast(`Case closed: it was ${L.persons[L.murderer].name}.`);return;}
  const sus=L.persons.map((p,i)=>({p,i})).filter(x=>x.p.role==='suspect');
  const victim=L.persons.find(p=>p.role==='victim');
  modal(`<h2>Who is the murderer?</h2><p>Choose the suspect who was alone with ${victim.name}.</p>
    <div class="pick">${sus.map(x=>`<button data-i="${x.i}">${avatar(x.p.name)}<span>${x.p.name}</span></button>`).join('')}</div>
    <div class="btns"><button class="btn" id="mNo">Cancel</button><button class="btn danger" id="mOk" disabled>Accuse</button></div>`);
  let sel=null;
  document.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.pick button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.i;$('mOk').disabled=false;});
  $('mNo').onclick=closeModal;
  $('mOk').onclick=()=>{ if(sel===null)return; verdict(sel); };
}
function verdict(i){
  const {L,st}=cur, p=L.persons[i], victim=L.persons.find(x=>x.role==='victim');
  if(i===L.murderer){
    st.solved=true; saveState(); cur.showSolution=true;
    modal(`<div style="text-align:center"><span class="result-stamp" style="color:#3e7b43">CASE CLOSED</span>
      <div style="width:96px;margin:0 auto">${avatar(p.name)}</div>
      <p><b>${p.name}</b> did it! ${p.name} was the only suspect in the same room as ${victim.name}.</p>
      <p style="color:#6e5d4d">${st.hints.length?`Solved with ${st.hints.length} hint${st.hints.length>1?'s':''}.`:'Solved without hints. Great detective work!'}</p></div>
      <div class="btns"><button class="btn" id="mOk">See the solution</button>${cur.idx<LEVELS.length-1?'<button class="btn primary" id="mNext">Next case →</button>':''}</div>`);
    $('mOk').onclick=closeModal;
    if($('mNext'))$('mNext').onclick=()=>{closeModal();location.hash='case-'+(cur.idx+2);};
    renderResult(); renderOverlay(); layout();
  } else {
    if(!st.wrong.includes(i))st.wrong.push(i); saveState();
    modal(`<div style="text-align:center"><span class="result-stamp" style="color:#b3261e">WRONG</span>
      <p><b>${p.name}</b> is innocent. Check the map again!</p></div>
      <div class="btns"><button class="btn" id="mReveal">Reveal solution</button><button class="btn primary" id="mOk">Keep investigating</button></div>`);
    $('mOk').onclick=closeModal;
    $('mReveal').onclick=()=>{ask('Reveal the solution?','This will show where everyone was and who the murderer is.','Reveal',true,()=>{
      st.revealed=true; saveState(); cur.showSolution=true; renderOverlay(); renderResult(); layout();
      toast(`The murderer was ${L.persons[L.murderer].name}.`,5000);});};
  }
}

$('btnRulesHome').onclick=showRules; $('btnRules').onclick=showRules; $('btnStory').onclick=showStory;
$('btnBack').onclick=()=>{location.hash='';};
$('tPen').onclick=()=>setTool('pen');
$('tEraser').onclick=()=>setTool('eraser');
$('tUndo').onclick=()=>{if(cur.st.strokes.length){cur.st.strokes.pop();redrawInk();saveState();}};
$('tClear').onclick=()=>{if(!cur.st.strokes.length)return;ask('Clear all notes?','This erases everything you wrote on this map.','Clear',true,()=>{cur.st.strokes=[];redrawInk();saveState();});};
$('tZoom').onclick=()=>{zoom=zoom===1?1.5:zoom===1.5?2:1;applyZoom();if(zoom>1)toast('Use two fingers to move the map.',2200);};
$('tHint').onclick=doHint;
$('tAccuse').onclick=accuse;

function route(){
  const m=location.hash.match(/case-(\d+)/);
  const i=m?+m[1]-1:-1;
  closeModal();
  if(i>=0&&i<LEVELS.length) openCase(i);
  else { cur=null; $('caseView').classList.add('hidden'); document.body.classList.remove('playing','land'); $('home').classList.remove('hidden'); renderHome(); window.scrollTo(0,0); }
}
setupInk();
let rT; window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(layout,80);});
window.addEventListener('orientationchange',()=>setTimeout(layout,250));
window.addEventListener('hashchange',route);
route();
if(!store.get('murdergrid-seen-rules',false)&&!cur){store.set('murdergrid-seen-rules',true);showRules();}
</script>
</body>
</html>
